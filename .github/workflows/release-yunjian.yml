name: release-yunjian

# One-shot uploader: attaches the staged EP001 Yunjian preview files
# (release-staging/) to the ep001-preview-yunjian release. The files are
# produced locally (edge-tts raw pipeline) and staged via the Git Data
# API because uploads.github.com rejects the local credential; the
# runner's gh CLI does the actual release upload. Never touches feed/.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish EP001 Yunjian preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ep001-preview-yunjian >/dev/null 2>&1 || \
            gh release create ep001-preview-yunjian --title "EP001 云健版试听（未发布）" \
              --notes "早班车｜兹韦列夫登顶世界第一：是加冕，还是捡漏？——云健纯人声版（无前导音、无乐床），仅供审听，不进 feed。"
          gh release upload ep001-preview-yunjian release-staging/ep001_yunjian.mp3 release-staging/qc_summary_yunjian.md --clobber
