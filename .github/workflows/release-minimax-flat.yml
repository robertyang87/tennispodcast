name: release-minimax-flat

# One-shot uploader: attaches the staged EP001 MiniMax flat (no-emotion)
# comparison files (release-staging/) to the ep001-preview-minimax-flat
# release. Files are produced via the synth-minimax-flat runner workflow
# + local assembly, and staged via the Git Data API because
# uploads.github.com rejects the local credential; the runner's gh CLI
# does the actual release upload. Never touches feed/.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish EP001 MiniMax flat preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ep001-preview-minimax-flat >/dev/null 2>&1 || \
            gh release create ep001-preview-minimax-flat --title "EP001 MiniMax 无情绪对比版试听（未发布）" \
              --notes "早班车｜兹韦列夫登顶世界第一：是加冕，还是捡漏？——MiniMax speech-2.8-hd＋温润男声、全段无情绪版，与云健版同稿同速同停顿对照，仅供审听，不进 feed。"
          gh release upload ep001-preview-minimax-flat release-staging/ep001_minimax_flat.mp3 release-staging/qc_summary_minimax_flat.md --clobber
