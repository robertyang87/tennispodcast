name: release-yunjian-mid

# One-shot uploader: attaches the staged EP001 (1102) Yunjian MID preview
# files (release-staging/) to the ep001-preview-yunjian-mid release. The
# files are produced locally (edge-tts raw pipeline) and staged via the
# Git Data API because uploads.github.com rejects the local credential;
# the runner's gh CLI does the actual release upload. Never touches feed/.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish EP001 Yunjian MID preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ep001-preview-yunjian-mid >/dev/null 2>&1 || \
            gh release create ep001-preview-yunjian-mid --title "EP001 云健中速版试听（未发布）" \
              --notes "早班车｜兹韦列夫登顶世界第一：是加冕，还是捡漏？——云健中速版（播客独立语速定档：净语速约 320 字/分；提速版 366 字/分经所有者耳判太快后放慢；无前导音、无乐床），仅供审听，不进 feed。"
          gh release upload ep001-preview-yunjian-mid release-staging/ep001_yunjian_mid.mp3 release-staging/qc_summary_yunjian_mid.md --clobber
